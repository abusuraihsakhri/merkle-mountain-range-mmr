[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "merkle-mountain-range-mmr"
version = "2.0.0"
description = "Merkle Mountain Range (MMR) Dynamic Append-Only Cryptographic Accumulator"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
merkle-mountain-range-mmr = "merkle_mountain_range.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/merkle-mountain-range-mmr"
Repository = "https://github.com/abusuraihsakhri/merkle-mountain-range-mmr.git"
