name: Python and browser verification

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: python -m pip install -e ".[api,test]"
      - name: Compile Python source
        run: python -m compileall -q agents merkle_mountain_range cli.py enrichment.py simulator.py
      - name: Run tests
        run: python -m pytest -q
      - name: CLI smoke tests
        run: |
          merkle-mountain-range-mmr mmr --leaf alpha --leaf beta --prove-index 0 --consistency-from 1
          python cli.py verify-audit
